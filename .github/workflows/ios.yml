# Compiles and tests Little Baby Log on a real iOS Simulator.
# Package tests and the UI smoke test run inside the simulator via xcodebuild.
# They are not a substitute for a signed App Store upload.
name: iOS

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    name: iOS Simulator tests
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
          uname -m
          xcrun simctl list devices available

      - name: XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Choose simulator
        id: sim
        run: |
          set -euo pipefail
          NAME=""
          for candidate in "iPhone 16" "iPhone 17" "iPhone 15"; do
            if xcrun simctl list devices available | grep -F "$candidate (" >/dev/null; then
              NAME="$candidate"
              break
            fi
          done
          if [ -z "$NAME" ]; then
            echo "No known iPhone simulator. Available devices:"
            xcrun simctl list devices available
            exit 1
          fi
          LINE=$(xcrun simctl list devices available | grep -F "$NAME (" | head -1)
          UDID=$(printf '%s\n' "$LINE" | sed -E 's/.*\(([0-9A-Fa-f-]+)\).*/\1/')
          test -n "$UDID"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using $NAME $UDID"

      - name: Release compile for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project LittleBabyLog.xcodeproj \
            -scheme LittleBabyLog \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Test on iOS Simulator
        run: |
          set -o pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          DERIVED="$RUNNER_TEMP/Derived"
          xcodebuild build-for-testing \
            -project LittleBabyLog.xcodeproj \
            -scheme LittleBabyLog \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          APP=$(find "$DERIVED/Build/Products" -type d -name 'LittleBabyLog.app' | head -1)
          test -d "$APP"
          xcrun simctl install "$UDID" "$APP"
          # The gallery stays empty, including system widgets, until chronod has scanned the new extension.
          xcrun simctl launch "$UDID" com.harrisliangsu.littlebabylog || true
          sleep 5
          xcrun simctl terminate "$UDID" com.harrisliangsu.littlebabylog || true
          # system/com.apple.chronod is the wrong domain. The simulator says to use the user one.
          xcrun simctl spawn "$UDID" launchctl kickstart -k user/foreground/com.apple.chronod || true
          sleep 3
          xcodebuild test-without-building \
            -project LittleBabyLog.xcodeproj \
            -scheme LittleBabyLog \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$DERIVED" \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Reset simulator appearance
        if: always()
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$UDID" || true
          xcrun simctl ui "$UDID" appearance light || true

      - name: Installed widget extension
        if: always()
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          CONTAINER=$(xcrun simctl get_app_container "$UDID" com.harrisliangsu.littlebabylog app)
          echo "Installed on $UDID"
          APPEX="$CONTAINER/PlugIns/LittleBabyLogWidgets.appex"
          test -d "$APPEX"
          echo "Installed app: $CONTAINER"
          plutil -p "$APPEX/Info.plist"
          POINT=$(plutil -extract NSExtension.NSExtensionPointIdentifier raw -o - "$APPEX/Info.plist")
          test "$POINT" = "com.apple.widgetkit-extension"
          test -e "$APPEX/LittleBabyLogWidgets"
          echo "Widget extension is inside the installed app and uses the WidgetKit extension point."

      - name: Export screenshots and logs
        if: always()
        run: |
          set +e
          mkdir -p artifacts/screenshots
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/TestResults.xcresult" \
            --output-path artifacts/screenshots
          find artifacts -type f | head -100
          cp -R "$RUNNER_TEMP/TestResults.xcresult" artifacts/TestResults.xcresult 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-results
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

  # Uploads a build to App Store Connect only. It does not submit for App Store
  # review, Beta App Review, or an external TestFlight group.
  testflight-internal:
    name: Internal TestFlight upload
    needs: simulator
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26-intel
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Require signing secrets
        id: creds
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "$KEY" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ] && [ -n "$TEAM" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ASC API key or team id is not configured on this repository."
            echo "Upload was not attempted. Required secret names:"
            echo "APP_STORE_CONNECT_API_KEY, APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APPLE_TEAM_ID"
            exit 1
          fi

      - name: Xcode
        if: steps.creds.outputs.present == 'true'
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: XcodeGen
        if: steps.creds.outputs.present == 'true'
        run: brew install xcodegen

      - name: Archive and upload
        if: steps.creds.outputs.present == 'true'
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          KEY_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s\n' "$KEY" > "$KEY_DIR/AuthKey_${KEY_ID}.p8"
          cat > Config/Local.xcconfig <<EOF
          DEVELOPMENT_TEAM = ${TEAM}
          EOF
          xcodegen generate
          ARCHIVE="$RUNNER_TEMP/LittleBabyLog.xcarchive"
          EXPORT="$RUNNER_TEMP/export"
          mkdir -p "$EXPORT"
          cat > "$EXPORT/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -project LittleBabyLog.xcodeproj -scheme LittleBabyLog -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" -allowProvisioningUpdates \
            APS_ENVIRONMENT=production \
            -authenticationKeyPath "$KEY_DIR/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER" \
            archive
          xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportOptionsPlist "$EXPORT/ExportOptions.plist" \
            -exportPath "$EXPORT" -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_DIR/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"
          IPA=$(find "$EXPORT" -name '*.ipa' -print -quit)
          test -n "$IPA"
          REPORT="$RUNNER_TEMP/exported-entitlements.txt"
          mkdir -p artifacts
          python3 - "$ARCHIVE" "$IPA" "$REPORT" <<'PY'
          import plistlib, subprocess, sys, zipfile
          from pathlib import Path
          archive, ipa, report = map(Path, sys.argv[1:4])

          def entitlements(target: Path) -> dict:
              raw = subprocess.check_output(["codesign", "-d", "--entitlements", ":-", str(target)], stderr=subprocess.DEVNULL)
              return plistlib.loads(raw)

          def line(label, blob):
              aps = blob.get("aps-environment", "(absent)")
              containers = blob.get("com.apple.developer.icloud-container-identifiers", [])
              services = blob.get("com.apple.developer.icloud-services", [])
              groups = blob.get("com.apple.security.application-groups", [])
              return f"{label} aps-environment={aps} icloud={containers} services={services} groups={groups}"

          unpacked = Path("/tmp/lbl-ipa")
          if unpacked.exists():
              subprocess.check_call(["rm", "-rf", str(unpacked)])
          unpacked.mkdir()
          with zipfile.ZipFile(ipa) as zf:
              zf.extractall(unpacked)
          app = next(Path(unpacked, "Payload").glob("*.app"))
          exported = entitlements(app)
          archived_app = next(archive.glob("Products/Applications/*.app"))
          archived = entitlements(archived_app)
          text = "\n".join([
              line("archive-not-final", archived),
              line("exported-ipa", exported),
              f"ipa={ipa.name}",
          ]) + "\n"
          report.write_text(text)
          print(text, end="")
          containers = exported.get("com.apple.developer.icloud-container-identifiers") or []
          services = exported.get("com.apple.developer.icloud-services") or []
          groups = exported.get("com.apple.security.application-groups") or []
          if exported.get("aps-environment") != "production":
              sys.exit("exported IPA aps-environment is not production")
          if "iCloud.com.harrisliangsu.littlebabylog" not in containers or "CloudKit" not in services:
              sys.exit("exported IPA is missing the Little Baby Log CloudKit container")
          if "group.com.harrisliangsu.littlebabylog" not in groups:
              sys.exit("exported IPA is missing the Little Baby Log app group")
          PY
          cp "$REPORT" artifacts/exported-entitlements.txt
          mkdir -p "$HOME/private_keys"
          cp "$KEY_DIR/AuthKey_${KEY_ID}.p8" "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          xcrun altool --upload-app --file "$IPA" --type ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
          echo "Upload finished. This job does not submit App Review or external TestFlight."
          KEY_PATH="$KEY_DIR/AuthKey_${KEY_ID}.p8" \
          GROUP_ID="fad28ab2-c1ca-49f8-9f79-e712e34a5410" \
          MARKETING_VERSION="$(awk -F'"' '/MARKETING_VERSION:/ {print $2; exit}' project.yml)" \
          BUILD="$(awk -F'"' '/CURRENT_PROJECT_VERSION:/ {print $2; exit}' project.yml)" \
          python3 scripts/assign-internal-group.py
          rm -f "$KEY_DIR/AuthKey_${KEY_ID}.p8" "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
      - name: Keep exported entitlement check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exported-ipa-entitlements
          path: artifacts/exported-entitlements.txt
          if-no-files-found: warn
          retention-days: 14
