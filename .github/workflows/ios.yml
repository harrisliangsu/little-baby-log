# Compiles and tests Little Baby Log on a real iOS Simulator.
# Package tests and the UI smoke test run inside the simulator via xcodebuild.
# They are not a substitute for a signed App Store upload.
name: iOS

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    name: iOS Simulator tests
    runs-on: macos-26-intel
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version
          uname -m
          xcrun simctl list devices available

      - name: XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Choose simulator
        id: sim
        run: |
          set -euo pipefail
          NAME=""
          for candidate in "iPhone 16" "iPhone 17" "iPhone 15"; do
            if xcrun simctl list devices available | grep -F "$candidate (" >/dev/null; then
              NAME="$candidate"
              break
            fi
          done
          if [ -z "$NAME" ]; then
            echo "No known iPhone simulator. Available devices:"
            xcrun simctl list devices available
            exit 1
          fi
          LINE=$(xcrun simctl list devices available | grep -F "$NAME (" | head -1)
          UDID=$(printf '%s\n' "$LINE" | sed -E 's/.*\(([0-9A-Fa-f-]+)\).*/\1/')
          test -n "$UDID"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "Using $NAME $UDID"

      - name: Release compile for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project LittleBabyLog.xcodeproj \
            -scheme LittleBabyLog \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Test on iOS Simulator
        run: |
          set -o pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          DERIVED="$RUNNER_TEMP/Derived"
          xcodebuild build-for-testing \
            -project LittleBabyLog.xcodeproj \
            -scheme LittleBabyLog \
            -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath "$DERIVED" \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          APP=$(find "$DERIVED/Build/Products" -type d -name 'LittleBabyLog.app' | head -1)
          test -d "$APP"
          xcrun simctl install "$UDID" "$APP"
          # The gallery stays empty, including system widgets, until chronod has scanned the new extension.
          xcrun simctl launch "$UDID" com.harrisliangsu.littlebabylog || true
          sleep 5
          xcrun simctl terminate "$UDID" com.harrisliangsu.littlebabylog || true
          # system/com.apple.chronod is the wrong domain. The simulator says to use the user one.
          xcrun simctl spawn "$UDID" launchctl kickstart -k user/foreground/com.apple.chronod || true
          sleep 3
          xcode_test() {
            xcodebuild test-without-building \
              -project LittleBabyLog.xcodeproj \
              -scheme LittleBabyLog \
              -destination "platform=iOS Simulator,id=$UDID" \
              -derivedDataPath "$DERIVED" \
              "$@" \
              CODE_SIGN_IDENTITY=- \
              CODE_SIGNING_ALLOWED=YES \
              CODE_SIGNING_REQUIRED=NO \
              AD_HOC_CODE_SIGNING_ALLOWED=YES
          }
          fail=0
          if ! xcode_test -only-testing:LittleBabyLogUITests/SmokeUITests/testAppearanceRelationDetailAndOrder \
            -resultBundlePath "$RUNNER_TEMP/TestResults-appearance.xcresult"; then
            echo "appearance run did not start or failed; trying once more"
            xcode_test -only-testing:LittleBabyLogUITests/SmokeUITests/testAppearanceRelationDetailAndOrder \
              -resultBundlePath "$RUNNER_TEMP/TestResults-appearance-retry.xcresult" || fail=1
          fi
          xcrun simctl ui "$UDID" appearance dark
          xcode_test -only-testing:LittleBabyLogUITests/SmokeUITests/testSavedSystemModeOpensDark \
            -resultBundlePath "$RUNNER_TEMP/TestResults-dark.xcresult" || fail=1
          xcrun simctl ui "$UDID" appearance light
          xcode_test \
            -skip-testing:LittleBabyLogUITests/SmokeUITests/testAppearanceRelationDetailAndOrder \
            -skip-testing:LittleBabyLogUITests/SmokeUITests/testSavedSystemModeOpensDark \
            -resultBundlePath "$RUNNER_TEMP/TestResults.xcresult" || fail=1
          exit "$fail"

      - name: Reset simulator appearance
        if: always()
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$UDID" || true
          xcrun simctl ui "$UDID" appearance light || true

      - name: Installed widget extension
        if: always()
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          CONTAINER=$(xcrun simctl get_app_container "$UDID" com.harrisliangsu.littlebabylog app)
          echo "Installed on $UDID"
          APPEX="$CONTAINER/PlugIns/LittleBabyLogWidgets.appex"
          test -d "$APPEX"
          echo "Installed app: $CONTAINER"
          plutil -p "$APPEX/Info.plist"
          POINT=$(plutil -extract NSExtension.NSExtensionPointIdentifier raw -o - "$APPEX/Info.plist")
          test "$POINT" = "com.apple.widgetkit-extension"
          test -e "$APPEX/LittleBabyLogWidgets"
          echo "Widget extension is inside the installed app and uses the WidgetKit extension point."

      - name: Export screenshots and logs
        if: always()
        run: |
          set +e
          mkdir -p artifacts/screenshots
          xcrun xcresulttool export attachments \
            --path "$RUNNER_TEMP/TestResults.xcresult" \
            --output-path artifacts/screenshots
          find artifacts -type f | head -100
          cp -R "$RUNNER_TEMP/TestResults.xcresult" artifacts/TestResults.xcresult 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-results
          path: artifacts
          if-no-files-found: warn
          retention-days: 14

  # Uploads a build to App Store Connect only. It does not submit for App Store
  # review, Beta App Review, or an external TestFlight group.
  testflight-internal:
    name: Internal TestFlight upload
    needs: simulator
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-26-intel
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Require signing secrets
        id: creds
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          if [ -n "$KEY" ] && [ -n "$KEY_ID" ] && [ -n "$ISSUER" ] && [ -n "$TEAM" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ASC API key or team id is not configured on this repository."
            echo "Upload was not attempted. Required secret names:"
            echo "APP_STORE_CONNECT_API_KEY, APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_ISSUER_ID, APPLE_TEAM_ID"
            exit 1
          fi

      - name: Xcode
        if: steps.creds.outputs.present == 'true'
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then
            sudo xcode-select -s /Applications/Xcode_26.6.app
          elif [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app
          fi
          xcodebuild -version

      - name: XcodeGen
        if: steps.creds.outputs.present == 'true'
        run: brew install xcodegen

      - name: Archive and upload
        if: steps.creds.outputs.present == 'true'
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          umask 077
          KEY_DIR="$RUNNER_TEMP/private_keys"
          mkdir -p "$KEY_DIR"
          printf '%s\n' "$KEY" > "$KEY_DIR/AuthKey_${KEY_ID}.p8"
          cat > Config/Local.xcconfig <<EOF
          DEVELOPMENT_TEAM = ${TEAM}
          EOF
          xcodegen generate
          ARCHIVE="$RUNNER_TEMP/LittleBabyLog.xcarchive"
          EXPORT="$RUNNER_TEMP/export"
          mkdir -p "$EXPORT"
          cat > "$EXPORT/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          # project.yml sets CODE_SIGN_STYLE=Automatic, so LittleBabyLog and
          # LittleBabyLogWidgets are automatically signed for development.
          # Apple Distribution on that style is the conflict that failed archive
          # (exit 65): "conflicting provisioning settings". Automatic signing
          # with no identity, -allowProvisioningUpdates, and this API key
          # instead archives as Apple Development and creates a "Created via
          # API" certificate whose private key stays on the runner. Archive
          # with signing disabled and do not pass the API key here, so this
          # step cannot mint that certificate. Ad-hoc sign ("-") only to put
          # the expanded entitlements in a signature; exportArchive keeps
          # capability entitlements that are already signed. Distribution
          # signing is the export below, using the cloud-managed Apple
          # Distribution certificate for this API key.
          xcodebuild -project LittleBabyLog.xcodeproj -scheme LittleBabyLog -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            APS_ENVIRONMENT=production \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            DEVELOPMENT_TEAM="${TEAM}" \
            archive
          xcodebuild -project LittleBabyLog.xcodeproj -target LittleBabyLog -configuration Release \
            -destination 'generic/platform=iOS' -showBuildSettings \
            APS_ENVIRONMENT=production DEVELOPMENT_TEAM="${TEAM}" CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/app-settings.txt"
          xcodebuild -project LittleBabyLog.xcodeproj -target LittleBabyLogWidgets -configuration Release \
            -destination 'generic/platform=iOS' -showBuildSettings \
            APS_ENVIRONMENT=production DEVELOPMENT_TEAM="${TEAM}" CODE_SIGNING_ALLOWED=NO \
            > "$RUNNER_TEMP/widget-settings.txt"
          python3 - "$ARCHIVE" "$RUNNER_TEMP/app-settings.txt" "$RUNNER_TEMP/widget-settings.txt" <<'PY'
          import plistlib, re, subprocess, sys
          from pathlib import Path

          archive = Path(sys.argv[1])
          app_settings_path, widget_settings_path = map(Path, sys.argv[2:4])
          GROUP = "group.com.harrisliangsu.littlebabylog"
          CONTAINER = "iCloud.com.harrisliangsu.littlebabylog"

          def settings_of(path: Path) -> dict:
              found = {}
              capture = False
              for line in path.read_text().splitlines():
                  if line.startswith("Build settings for action"):
                      found = {}
                      capture = True
                      continue
                  if not capture:
                      continue
                  match = re.match(r"    ([A-Za-z0-9_]+) = (.*)$", line)
                  if match:
                      found[match.group(1)] = match.group(2)
              if not found.get("CODE_SIGN_ENTITLEMENTS"):
                  sys.exit(f"{path.name} did not resolve CODE_SIGN_ENTITLEMENTS")
              return found

          def substitute(text: str, settings: dict, label: str) -> str:
              def repl(match):
                  key = match.group(1) or match.group(2)
                  if key not in settings:
                      sys.exit(f"{label} uses $({key}), which the Release build settings do not set")
                  return settings[key]
              expanded = text
              for _ in range(10):
                  updated = re.sub(r"\$\(([^)]+)\)|\$\{([^}]+)\}", repl, expanded)
                  if updated == expanded:
                      break
                  expanded = updated
              else:
                  sys.exit(f"{label} build settings did not finish substituting")
              if "$(" in expanded or "${" in expanded:
                  sys.exit(f"{label} still has an unsubstituted build setting")
              return expanded

          def expand(settings: dict, dest: Path) -> None:
              src = Path(substitute(settings["CODE_SIGN_ENTITLEMENTS"], settings, "CODE_SIGN_ENTITLEMENTS"))
              if not src.is_file():
                  sys.exit(f"entitlements file not found: {src}")
              dest.write_text(substitute(src.read_text(), settings, str(src)))
              subprocess.check_call(["plutil", "-lint", str(dest)])

          def sign(target: Path, entitlements) -> None:
              cmd = ["codesign", "--force", "--sign", "-"]
              if entitlements is not None:
                  cmd.extend(["--entitlements", str(entitlements), "--generate-entitlement-der"])
              cmd.append(str(target))
              subprocess.check_call(cmd)

          def nested_bins(bundle: Path):
              found = []
              for pattern in ("Frameworks/*.framework", "Frameworks/*.dylib"):
                  found.extend(bundle.glob(pattern))
              return sorted(found)

          app_settings = settings_of(app_settings_path)
          widget_settings = settings_of(widget_settings_path)
          if app_settings.get("APS_ENVIRONMENT") != "production":
              sys.exit(f"Release APS_ENVIRONMENT is {app_settings.get('APS_ENVIRONMENT')!r}, expected production")

          apps = sorted(archive.glob("Products/Applications/*.app"))
          if len(apps) != 1:
              sys.exit(f"expected one archived app, found {[p.name for p in apps]}")
          app = apps[0]
          appexes = sorted(app.glob("PlugIns/*.appex"))
          if len(appexes) != 1:
              sys.exit(f"expected one widget appex, found {[p.name for p in appexes]}")
          appex = appexes[0]

          work = Path(sys.argv[2]).parent / "adhoc-entitlements"
          work.mkdir(exist_ok=True)
          app_xcent = work / "app.xcent"
          widget_xcent = work / "widget.xcent"
          expand(app_settings, app_xcent)
          expand(widget_settings, widget_xcent)
          for framework in nested_bins(appex):
              sign(framework, None)
          sign(appex, widget_xcent)
          for framework in nested_bins(app):
              sign(framework, None)
          sign(app, app_xcent)

          def signature(target: Path) -> str:
              proc = subprocess.run(["codesign", "-dv", str(target)], capture_output=True, text=True)
              text = proc.stderr + proc.stdout
              if proc.returncode != 0:
                  sys.exit(f"codesign -dv {target} failed\n{text}")
              return text

          def signed_entitlements(target: Path) -> dict:
              raw = subprocess.check_output(
                  ["codesign", "-d", "--entitlements", ":-", str(target)],
                  stderr=subprocess.DEVNULL,
              )
              return plistlib.loads(raw)

          for target in (appex, app):
              text = signature(target)
              if "Signature=adhoc" not in text and "flags=0x2(adhoc)" not in text:
                  sys.exit(f"{target.name} is not ad-hoc signed\n{text}")
              if "Apple Development" in text or "Created via API" in text or "Apple Distribution" in text:
                  sys.exit(f"{target.name} was signed with an Apple certificate during archive\n{text}")

          archived = signed_entitlements(app)
          archived_appex = signed_entitlements(appex)
          if archived.get("aps-environment") != "production":
              sys.exit("ad-hoc archive aps-environment is not production")
          containers = archived.get("com.apple.developer.icloud-container-identifiers") or []
          services = archived.get("com.apple.developer.icloud-services") or []
          if CONTAINER not in containers or "CloudKit" not in services:
              sys.exit("ad-hoc archive is missing the Little Baby Log CloudKit container")
          if GROUP not in (archived.get("com.apple.security.application-groups") or []):
              sys.exit("ad-hoc archive is missing the Little Baby Log app group")
          if GROUP not in (archived_appex.get("com.apple.security.application-groups") or []):
              sys.exit("ad-hoc archive widget is missing the Little Baby Log app group")
          print("ad-hoc archive carries production push, CloudKit, and the app group")
          PY
          xcodebuild -exportArchive -archivePath "$ARCHIVE" -exportOptionsPlist "$EXPORT/ExportOptions.plist" \
            -exportPath "$EXPORT" -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_DIR/AuthKey_${KEY_ID}.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER"
          IPA=$(find "$EXPORT" -name '*.ipa' -print -quit)
          test -n "$IPA"
          REPORT="$RUNNER_TEMP/exported-entitlements.txt"
          mkdir -p artifacts
          python3 - "$ARCHIVE" "$IPA" "$REPORT" <<'PY'
          import plistlib, subprocess, sys, zipfile
          from pathlib import Path
          archive, ipa, report = map(Path, sys.argv[1:4])

          GROUP = "group.com.harrisliangsu.littlebabylog"
          CONTAINER = "iCloud.com.harrisliangsu.littlebabylog"

          def entitlements(target: Path) -> dict:
              raw = subprocess.check_output(["codesign", "-d", "--entitlements", ":-", str(target)], stderr=subprocess.DEVNULL)
              return plistlib.loads(raw)

          def signature(target: Path) -> str:
              proc = subprocess.run(["codesign", "-dv", str(target)], capture_output=True, text=True)
              text = proc.stderr + proc.stdout
              if proc.returncode != 0:
                  sys.exit(f"codesign -dv {target} failed\n{text}")
              return text

          def line(label, blob):
              aps = blob.get("aps-environment", "(absent)")
              containers = blob.get("com.apple.developer.icloud-container-identifiers", [])
              services = blob.get("com.apple.developer.icloud-services", [])
              groups = blob.get("com.apple.security.application-groups", [])
              return f"{label} aps-environment={aps} icloud={containers} services={services} groups={groups}"

          def one_appex(app: Path) -> Path:
              found = sorted(app.glob("PlugIns/*.appex"))
              if len(found) != 1:
                  sys.exit(f"expected one widget appex in {app}, found {[p.name for p in found]}")
              return found[0]

          def require_app(label, blob):
              containers = blob.get("com.apple.developer.icloud-container-identifiers") or []
              services = blob.get("com.apple.developer.icloud-services") or []
              groups = blob.get("com.apple.security.application-groups") or []
              if blob.get("aps-environment") != "production":
                  sys.exit(f"{label} aps-environment is not production")
              if CONTAINER not in containers or "CloudKit" not in services:
                  sys.exit(f"{label} is missing the Little Baby Log CloudKit container")
              if GROUP not in groups:
                  sys.exit(f"{label} is missing the Little Baby Log app group")

          def require_distribution(label, target: Path):
              text = signature(target)
              if "Apple Development" in text or "Created via API" in text:
                  sys.exit(f"{label} is signed with an Apple Development certificate\n{text}")
              if "Apple Distribution" not in text:
                  sys.exit(f"{label} is not signed with Apple Distribution\n{text}")

          unpacked = Path("/tmp/lbl-ipa")
          if unpacked.exists():
              subprocess.check_call(["rm", "-rf", str(unpacked)])
          unpacked.mkdir()
          with zipfile.ZipFile(ipa) as zf:
              zf.extractall(unpacked)
          app = next(Path(unpacked, "Payload").glob("*.app"))
          exported = entitlements(app)
          exported_appex = entitlements(one_appex(app))
          archived_app = next(archive.glob("Products/Applications/*.app"))
          archived = entitlements(archived_app)
          archived_appex = entitlements(one_appex(archived_app))
          text = "\n".join([
              line("adhoc-archive", archived),
              line("adhoc-archive-widget", archived_appex),
              line("exported-ipa", exported),
              line("exported-widget", exported_appex),
              f"ipa={ipa.name}",
          ]) + "\n"
          report.write_text(text)
          print(text, end="")
          require_app("adhoc archive", archived)
          if GROUP not in (archived_appex.get("com.apple.security.application-groups") or []):
              sys.exit("ad-hoc archive widget is missing the Little Baby Log app group")
          require_app("exported IPA", exported)
          if GROUP not in (exported_appex.get("com.apple.security.application-groups") or []):
              sys.exit("exported widget is missing the Little Baby Log app group")
          require_distribution("exported IPA", app)
          require_distribution("exported widget", one_appex(app))
          PY
          cp "$REPORT" artifacts/exported-entitlements.txt
          mkdir -p "$HOME/private_keys"
          cp "$KEY_DIR/AuthKey_${KEY_ID}.p8" "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
          xcrun altool --upload-app --file "$IPA" --type ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER"
          echo "Upload finished. This job does not submit App Review or external TestFlight."
          KEY_PATH="$KEY_DIR/AuthKey_${KEY_ID}.p8" \
          GROUP_ID="fad28ab2-c1ca-49f8-9f79-e712e34a5410" \
          MARKETING_VERSION="$(awk -F'"' '/MARKETING_VERSION:/ {print $2; exit}' project.yml)" \
          BUILD="$(awk -F'"' '/CURRENT_PROJECT_VERSION:/ {print $2; exit}' project.yml)" \
          python3 scripts/assign-internal-group.py
          rm -f "$KEY_DIR/AuthKey_${KEY_ID}.p8" "$HOME/private_keys/AuthKey_${KEY_ID}.p8"
      - name: Keep exported entitlement check
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exported-ipa-entitlements
          path: artifacts/exported-entitlements.txt
          if-no-files-found: warn
          retention-days: 14
